<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotation Ready">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#15464d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Rotation Ready</title>
<style>
/* Layout: court-first board; on tablets the controls and lineup sit in a right-hand rail */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#10201f; --muted:#526664; --line:#d1dcda;
  --court:#1f6f78; --court-line:#f4f7f6; --free:#cf9d62; --net:#0d1e21;
  --accent:#e0603a; --accent-ink:#ffffff; --brand:#15464d; --brand-ink:#ffffff; --sky:#4fb3bf; --ok:#2b7d50; --bad:#c2352b;
  --r-s:#c08d12; --r-oh:#2f6fd1; --r-mb:#ad3546; --r-opp:#6a4db3; --r-p:#56646f;
  --lib:#e0603a; --token:#ffffff; --token-ink:#10201f; --arrow:rgba(255,255,255,.75);
  --display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1517; --surface:#132326; --ink:#e6efee; --muted:#93a8a6; --line:#24393c;
  --court:#185a62; --court-line:#dde8e6; --free:#a7794a; --net:#040b0c;
  --accent:#f07a52; --accent-ink:#1a0b05; --brand:#1d6670; --brand-ink:#ffffff; --sky:#6cc6d1; --ok:#5cc28a; --bad:#f0695e;
  --r-s:#e2b136; --r-oh:#6b9cf0; --r-mb:#d9606f; --r-opp:#9a80e0; --r-p:#8796a1;
  --lib:#f07a52; --token:#f4f6f7; --token-ink:#10201f; --arrow:rgba(255,255,255,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1517; --surface:#132326; --ink:#e6efee; --muted:#93a8a6; --line:#24393c;
  --court:#185a62; --court-line:#dde8e6; --free:#a7794a; --net:#040b0c;
  --accent:#f07a52; --accent-ink:#1a0b05; --brand:#1d6670; --brand-ink:#ffffff; --sky:#6cc6d1; --ok:#5cc28a; --bad:#f0695e;
  --r-s:#e2b136; --r-oh:#6b9cf0; --r-mb:#d9606f; --r-opp:#9a80e0; --r-p:#8796a1;
  --lib:#f07a52; --token:#f4f6f7; --token-ink:#10201f; --arrow:rgba(255,255,255,.7); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
select,input,label{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1120px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);
  padding-block:10px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){
  .app{grid-template-columns:minmax(0,1fr) 340px;align-items:start;column-gap:22px}
  .controls{grid-column:2;grid-row:1}
  .board{grid-column:1;grid-row:1/span 2}
  .panel{grid-column:2;grid-row:2}
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brandband{background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brandband .logo{border-radius:10px;overflow:hidden;width:46px;flex:none;display:block}
.brandband .logo img{display:block;width:100%;height:auto}
.brandband .tagline{margin-top:2px;font-weight:600;opacity:1}
.brandband .tag{font-size:.74rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.brandband::after{content:"";flex:none;width:6px;align-self:stretch;border-radius:3px;background:var(--accent);margin-left:auto}
.brandband .logo{border:0;padding:0;cursor:pointer;background:transparent}
.brandband .logo.custom{background:#fff;padding:3px;height:46px;display:grid;place-items:center}
.brandband .logo.custom img{max-height:100%;width:auto;max-width:100%;object-fit:contain}
.brandband h1{overflow-wrap:anywhere}
.teamcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
@media (min-width:760px){.teamcard{grid-column:2;grid-row:3}}
.teamcard summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em}
.teamcard summary::-webkit-details-marker{display:none}
.teamcard summary::after{content:"+";margin-left:auto;font-family:var(--body);font-size:1.3rem;color:var(--muted)}
.teamcard[open] summary::after{content:"−"}
.teamcard .swatch{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.teambody{padding:0 14px 14px;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;min-height:40px;width:100%}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colorpick{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);font-weight:600}
.colorpick input{width:38px;height:38px;border:0;padding:0;background:none;border-radius:8px;flex:none}
.colorpick input::-webkit-color-swatch-wrapper{padding:0}.colorpick input::-webkit-color-swatch{border:1px solid rgba(0,0,0,.15);border-radius:8px}
.logorow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoprev{width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;background:#fff;overflow:hidden;color:#6b7b79;font-size:.7rem;text-align:center}
.logoprev img{max-width:100%;max-height:100%;object-fit:contain}
.filebtn{position:relative;overflow:hidden;display:inline-grid;place-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.teammsg{margin:0;font-size:.85rem;color:var(--bad)}.teammsg:empty{display:none}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--muted);font-size:.82rem}

.controls{display:grid;gap:10px;min-width:0}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:7px;font-weight:600;font-variant-numeric:tabular-nums;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.rotrow{display:flex;gap:6px;align-items:center}
.rotrow .seg{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:42px;min-height:44px;font-size:1.1rem;font-weight:700}

.board{display:grid;gap:10px;min-width:0;justify-items:center}
.courtscroll{width:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.courtwrap{--z:1;width:calc(var(--z) * min(100%,(100dvh - 120px) * .95));margin-inline:auto}
@media (min-width:760px){.courtwrap{width:calc(var(--z) * min(100%,(100dvh - 230px) * .95))}}
.zoombar{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.zoombar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;min-height:36px;font-weight:700;font-size:1rem}
.court{position:relative;width:100%;aspect-ratio:9/9.45;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.court svg:first-child{border-radius:6px}
.courtwrap.serving{padding-bottom:16%}
.court svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.c-free{fill:var(--free)} .c-court{fill:var(--court)} .c-sheen{display:none}
.court.wood{--court-line:var(--wood-line,#20323a);--arrow:rgba(25,30,32,.72)}
.court.wood .c-court{fill:url(#woodCourt)} .court.wood .c-free{fill:url(#woodCourt)} .court.wood .c-sheen{display:inline}
.court.wood .c-zone{opacity:.14}
.court.wood .c-txt{fill:var(--court-line);opacity:.9}
.court.wood .nm{color:#1d1a16;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.tok.off .nm,.court.wood .tok.off .nm{color:var(--ink);text-shadow:none} .c-line{stroke:var(--court-line);fill:none}
.c-nettxt{fill:#14202a;font-family:var(--body);font-weight:800} .c-zone{fill:var(--court-line);opacity:.18;font-family:var(--display);font-weight:700}
.c-txt{fill:var(--court-line);opacity:.8;font-family:var(--body);font-weight:600}
.arrows line{stroke:var(--arrow);stroke-width:.06;stroke-dasharray:.16 .12;stroke-linecap:round}
.arrows .ghost{fill:none;stroke:var(--arrow);stroke-width:.04;opacity:.6}
#ah path{fill:var(--arrow)}

.tok{position:absolute;width:clamp(34px,11.5%,60px);aspect-ratio:1;transform:translate(-50%,-50%);touch-action:none;
  transition:left .35s cubic-bezier(.3,.7,.2,1),top .35s cubic-bezier(.3,.7,.2,1);z-index:2;will-change:left,top}
.tok.drag{transition:none;z-index:5}
.disc{width:100%;height:100%;border-radius:50%;background:var(--token);color:var(--token-ink);
  border:3.5px solid var(--rc);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.28);
  font-family:var(--display);font-weight:700;font-size:clamp(12px,1.6vw,16px);position:relative}
.tok.drag .disc{transform:scale(1.1)}
.tok.sets .disc{box-shadow:0 0 0 3px var(--court),0 0 0 5.5px var(--r-s),0 2px 6px rgba(0,0,0,.3)}
.tok.L .disc{background:var(--lib);border-color:#fff;color:#fff}
.tok.bad .disc{border-color:var(--bad);outline:3px solid var(--bad);outline-offset:2px}
.zn{position:absolute;top:-5px;right:-6px;background:var(--net);color:#fff;font-family:var(--body);font-size:10px;font-weight:700;
  width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rl{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--rc);color:#fff;font-family:var(--body);font-size:9px;font-weight:700;line-height:1;padding:2px 4px;border-radius:6px;white-space:nowrap}
.rl:empty{display:none}
.tok.L .rl{background:var(--net)}
.tok.hasnum .lab{font-size:1.25em;font-variant-numeric:tabular-nums}
.nm{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:600;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:90px;overflow:hidden;text-overflow:ellipsis}
.serve-ball{position:absolute;width:3.2%;aspect-ratio:1;border-radius:50%;background:#fff6d6;border:2px solid #e2b136;transform:translate(-50%,-50%);z-index:3;transition:left .5s,top .5s}
.OH{--rc:var(--r-oh)} .MB{--rc:var(--r-mb)} .S{--rc:var(--r-s)} .OPP{--rc:var(--r-opp)} .P{--rc:var(--r-p)} .L{--rc:var(--lib)}
@media (prefers-reduced-motion:reduce){.tok,.serve-ball{transition:none}}

.steps{width:min(100%,560px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:6px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 4px;text-align:center;min-height:52px;display:grid;gap:1px;align-content:center}
.step b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.step span{font-size:.68rem;color:var(--muted);line-height:1.15}
.step[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.play{border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;min-width:52px;font-weight:700;font-size:1rem}

.info{width:min(100%,560px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.info h2{margin:0;font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em;display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-wrap:balance}
.info p{margin:0;line-height:1.45;color:var(--ink)}
.chip{font-family:var(--body);font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.02em}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.viol{margin:0;padding-left:18px;color:var(--bad);font-size:.88rem;line-height:1.4}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:.82rem;font-weight:600}
.hint{font-size:.78rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.panel h3{margin:0;font-family:var(--display);font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em;color:var(--brand)}
:root[data-theme="dark"] .panel h3{color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel h3{color:var(--sky)}}
.blurb{margin:0;color:var(--muted);font-size:.86rem;line-height:1.45}
.plist{display:grid;gap:7px}
.prow{display:grid;grid-template-columns:auto auto 58px minmax(0,1fr);gap:8px;align-items:center}
.pchip{width:40px;height:40px;border-radius:50%;border:3px solid var(--rc);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;background:var(--token);color:var(--token-ink)}
.prow.L .pchip{background:var(--lib);color:#fff}
.prow select,.prow input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;min-height:40px;min-width:0;width:100%}
.prow select{width:auto}
.prow input.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.prow input.num[aria-invalid="true"]{border-color:var(--bad);color:var(--bad)}
.numwarn{color:var(--bad);font-size:.82rem;margin:0}
.prow.bench{grid-template-columns:auto 58px minmax(0,1fr) auto}
.prow .subsel{max-width:92px;font-weight:600;color:var(--brand);border-color:var(--brand)}
.submsg{margin:0;font-size:.85rem;font-weight:600;color:var(--ok)}
.submsg:empty{display:none}
.numwarn:empty{display:none}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rc);margin-right:4px;vertical-align:-1px}
/* full-screen court */
.zoombar .fsbtn{padding-inline:16px;font-size:.9rem;color:var(--brand);border-color:var(--brand)}
.focusbar,.fsexit{display:none}
body.focus{overflow:hidden}
body.focus .board{position:fixed;inset:0;z-index:40;background:var(--bg);margin:0;display:flex;flex-direction:column;justify-content:safe center;align-items:center;gap:8px;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px))}
body.focus .zoombar,body.focus #steps,body.focus #info{display:none}
body.focus .courtscroll{overflow:visible;flex:none;width:min(100%,(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .8)}
body.focus .courtwrap{width:100%}
body.focus .focusbar{display:grid;gap:6px;justify-items:center}
.focusbar .fcap{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:.95rem}
.focusbar .frow{display:flex;gap:6px;align-items:center}
.focusbar button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:42px;min-height:42px;font-weight:700;font-variant-numeric:tabular-nums}
.focusbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.focusbar .fplay{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.focusbar .fsep{width:1px;align-self:stretch;background:var(--line);margin-inline:2px}
body.focus .fsexit{display:block;position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));z-index:5;
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;min-height:36px;box-shadow:0 2px 8px rgba(0,0,0,.18)}

</style>

function fresh(){const d={};for(const k in SYS)d[k]={lineup:SYS[k].players.map(p=>p[0]),names:{}};
  return {sys:'5-1',libero:true,mode:'receive',rot:1,step:2,data:d,ov:{}};}

function info(sys,id){
  const num=(S.data[sys].nums||{})[id]||'';
  if(id==='L')return{id:'L',role:'L',label:'L',def:'Libero',name:S.data[sys].names.L||'Libero',num};
  const p=SYS[sys].players.find(x=>x[0]===id);
  return{id,role:p[1],label:p[0],def:p[2],name:S.data[sys].names[id]||p[2],num};
}
const rotZ=(z,k)=>{for(let i=0;i<k;i++)z=z===1?6:z-1;return z;};

function lineup(){
  const s=S.sys,def=SYS[s];
  let ps=S.data[s].lineup.map((id,i)=>Object.assign(info(s,id),{zone:rotZ(i+1,S.rot-1)}));
  const setters=ps.filter(p=>p.role==='S');let setter;
  if(s==='5-1')setter=setters[0];
  else if(s==='6-2')setter=setters.find(p=>!isFront(p.zone))||setters[0];
  else if(s==='4-2')setter=setters.find(p=>isFront(p.zone))||setters[0];
  else setter=ps.find(p=>p.zone===3);
  if(setter)setter.sets=true;
  let liberoFor=null,mbServes=null;
  if(def.lib&&S.libero){
    const mbs=ps.filter(p=>p.role==='MB'&&!isFront(p.zone));
    const cand=mbs.find(p=>!(S.mode==='serve'&&p.zone===1));
    if(cand){liberoFor=cand;const L=Object.assign(info(s,'L'),{zone:cand.zone});ps=ps.map(p=>p===cand?L:p);}
    else if(mbs.length)mbServes=mbs[0];
  }
  const server=S.mode==='serve'?ps.find(p=>p.zone===1):null;
  return{ps,setter,liberoFor,mbServes,server};
}

function slots(c){
  const out={};
  if(S.sys==='6-6'){const m={4:'LF',3:'MF',2:'RF',5:'LB',6:'MBK',1:'RB'};c.ps.forEach(p=>out[p.id]=m[p.zone]);return out;}
  [true,false].forEach(row=>{
    const g=c.ps.filter(p=>isFront(p.zone)===row);
    const pref=p=>p.sets?(row?'RF':'RB'):row?{OH:'LF',MB:'MF',OPP:'RF',S:'RF'}[p.role]:{OH:'LB',MB:'MBK',L:'MBK',OPP:'RB',S:'RB'}[p.role];
    const used=new Set(),left=[];
    [...g].sort((a,b)=>(b.sets?1:0)-(a.sets?1:0)).forEach(p=>{const sl=pref(p);if(sl&&!used.has(sl)){out[p.id]=sl;used.add(sl);}else left.push(p);});
    const free=(row?['LF','MF','RF']:['LB','MBK','RB']).filter(x=>!used.has(x));
    left.sort((a,b)=>ZXY[a.zone][0]-ZXY[b.zone][0]).forEach((p,i)=>out[p.id]=free[i]);
  });
  return out;
}

function repair(pos,c){
  const z={};c.ps.forEach(p=>z[p.zone]=p.id);const m=.42;
  for(let it=0;it<90;it++){let moved=false;
    [[4,5],[3,6],[2,1]].forEach(([f,b])=>{const A=pos[z[f]],B=pos[z[b]];const d=A[1]+m-B[1];if(d>0){A[1]-=d/2;B[1]+=d/2;moved=true;}});
    [[4,3],[3,2],[5,6],[6,1]].forEach(([l,r])=>{const A=pos[z[l]],B=pos[z[r]];const d=A[0]+m-B[0];if(d>0){A[0]-=d/2;B[0]+=d/2;moved=true;}});
    for(const k in pos){pos[k][0]=Math.min(8.6,Math.max(.4,pos[k][0]));pos[k][1]=Math.min(8.6,Math.max(.45,pos[k][1]));}
    if(!moved)break;}
  return pos;
}

function passersOf(c){
  if(S.sys==='6-6')return c.ps.filter(p=>!p.sets);
  let ps=c.ps.filter(p=>(p.role==='L'||p.role==='OH')&&!p.sets);
  if(!c.ps.some(p=>p.role==='L')){const mb=c.ps.find(p=>p.role==='MB'&&!isFront(p.zone));if(mb)ps.push(mb);}
  return ps;
}

function basePos(step,c){
  const pos={};
  if(step===1){c.ps.forEach(p=>pos[p.id]=[...ZXY[p.zone]]);return pos;}
  if(S.mode==='serve'&&step===2){
    c.ps.forEach(p=>{const[x]=ZXY[p.zone];pos[p.id]=p===c.server?[7.7,9.5]:isFront(p.zone)?[x,1.7]:[x,6.2];});return pos;}
  if(S.mode==='receive'&&step===2){
    if(S.sys==='6-6'){const W={4:[1.7,3.9],3:[5.2,.9],2:[7.3,3.9],5:[2.3,6.9],6:[4.5,4.7],1:[6.7,6.9]};
      c.ps.forEach(p=>pos[p.id]=[...W[p.zone]]);return repair(pos,c);}
    const pas=passersOf(c);
    const SL={1:[[4.5,6.2]],2:[[2.7,6.0],[6.3,6.0]],3:[[1.8,6.0],[4.5,6.4],[7.2,6.0]],4:[[1.4,5.8],[3.5,6.3],[5.5,6.3],[7.6,5.8]]}[Math.min(pas.length,4)]||[];
    [...pas].sort((a,b)=>ZXY[a.zone][0]-ZXY[b.zone][0]||ZXY[a.zone][1]-ZXY[b.zone][1]).forEach((p,i)=>pos[p.id]=[...(SL[i]||ZXY[p.zone])]);
    c.ps.forEach(p=>{if(pos[p.id])return;const[x]=ZXY[p.zone];
      if(p.sets)pos[p.id]=isFront(p.zone)?[6.6,.8]:[{1:8.2,6:5.6,5:2.4}[p.zone],3.0];
      else if(isFront(p.zone))pos[p.id]=[x,.9];
      else pos[p.id]=[x<3?1.0:x>6?8.4:4.5,8.6];});
    return repair(pos,c);
  }
  const sl=slots(c);
  const attack=S.mode==='receive'&&step===3;
  const table=attack?ATK:(S.mode==='serve'&&step===4)?DEFO:DEF;
  c.ps.forEach(p=>pos[p.id]=attack&&p.sets?[...TARGET]:[...table[sl[p.id]]]);
  return pos;
}
const vkey=step=>[S.sys,S.libero?1:0,S.mode,S.rot,step].join('|');
function getPos(step,c){
  const pos=basePos(step,c),o=S.ov[vkey(step)];
  if(o)for(const id in o)if(pos[id])pos[id]=[...o[id]];
  return pos;
}

function overlaps(pos,c){
  const z={};c.ps.forEach(p=>z[p.zone]=p);const ex=c.server;const v=[];
  const n=p=>p.name;
  [[4,5],[3,6],[2,1]].forEach(([f,b])=>{const A=z[f],B=z[b];if(A===ex||B===ex)return;
    if(pos[A.id][1]>=pos[B.id][1])v.push({ids:[A.id,B.id],msg:`${n(A)} (zone ${f}) must be closer to the net than ${n(B)} (zone ${b}).`});});
  [[4,3],[3,2],[5,6],[6,1]].forEach(([l,r])=>{const A=z[l],B=z[r];if(A===ex||B===ex)return;
    if(pos[A.id][0]>=pos[B.id][0])v.push({ids:[A.id,B.id],msg:`${n(A)} (zone ${l}) must stay left of ${n(B)} (zone ${r}).`});});
  return v;
}

const court=document.getElementById('court'),toks={};let cur={},curC=null,prevPos=null,drag=null,playT=null,raf=0;

function buildStatic(){

function render(){
  const c=lineup();curC=c;
  document.querySelectorAll('[data-sys]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sys===S.sys));
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  document.querySelectorAll('[data-rot]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.rot===S.rot));
  document.getElementById('steps').innerHTML=STEPS[S.mode].map((t,i)=>`<button class="step" data-step="${i+1}" aria-pressed="${S.step===i+1}"><b>${i+1}</b><span>${t}</span></button>`).join('')+
    `<button class="play" id="play" aria-label="Play all steps">${playT?'■':'▶'}</button>`;
  const fb=document.getElementById('focusBar');
  if(fb)fb.innerHTML=`<div class="fcap">${S.mode==='serve'?'Serving':'Receiving'} · Rotation ${S.rot} · ${STEPS[S.mode][S.step-1]}</div>
    <div class="frow"><button data-act="rotPrev" aria-label="Previous rotation">‹</button><button data-act="rotNext" aria-label="Next rotation">›</button><span class="fsep"></span>
    ${[1,2,3,4].map(n=>`<button data-step="${n}" aria-pressed="${S.step===n}" aria-label="Step ${n}: ${STEPS[S.mode][n-1]}">${n}</button>`).join('')}
    <button class="fplay" data-act="play" aria-label="Play all steps">${playT?'■':'▶'}</button></div>`;
  document.getElementById('zoneNums').innerHTML=S.step===1?Object.entries(ZXY).map(([z,[x,y]])=>`<text class="c-zone" x="${x}" y="${y+.55}" font-size="1.6" text-anchor="middle">${z}</text>`).join(''):'';

  const pos=getPos(S.step,c);cur=pos;
  const present=new Set(c.ps.map(p=>p.id));
  for(const id in toks)if(!present.has(id)){toks[id].remove();delete toks[id];}
  c.ps.forEach(p=>{
    let t=toks[p.id];
    if(!t){t=document.createElement('div');t.dataset.id=p.id;t.innerHTML='<div class="disc"><span class="lab"></span><span class="zn"></span><span class="rl"></span></div><div class="nm"></div>';
      court.appendChild(t);toks[p.id]=t;bindDrag(t);
      const start=pos[p.id];t.style.left=start[0]/9*100+'%';t.style.top=(start[1]+.45)/9.45*100+'%';}
    t.className='tok '+p.role+(p.sets?' sets':'')+(p.num?' hasnum':'');
    t.querySelector('.lab').textContent=p.num||p.label;t.querySelector('.rl').textContent=p.num?p.label:'';t.querySelector('.zn').textContent=p.zone;t.querySelector('.nm').textContent=p.name;
    t.setAttribute('aria-label',`${p.num?'#'+p.num+' ':''}${p.name}, ${FULL[p.role]}, zone ${p.zone}`);
    place(t,pos[p.id]);t.classList.toggle('off',pos[p.id][1]>9);
  });
  const ball=document.getElementById('ball');
  document.getElementById('courtWrap').classList.toggle('serving',!!(c.server&&S.step===2));
  if(c.server&&S.step===2){ball.hidden=false;const sp=pos[c.server.id];ball.style.left=(sp[0]+.42)/9*100+'%';ball.style.top=(sp[1]-.35+.45)/9.45*100+'%';}else ball.hidden=true;
  prevPos=S.step>1?getPos(S.step-1,c):null;
  drawArrows(c,pos);renderInfo(c,pos);
}
function place(t,[x,y]){t.style.left=x/9*100+'%';t.style.top=(y+.45)/9.45*100+'%';}

function drawArrows(c,pos){
  const g=document.getElementById('arrowG');
  if(S.step===1||!prevPos){g.innerHTML='';return;}
  const prev=prevPos;let h='';
  c.ps.forEach(p=>{const a=prev[p.id],b=pos[p.id];if(!a||!b)return;const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy);if(d<.5)return;
    const r=.5,ex=b[0]-dx/d*r,ey=b[1]-dy/d*r;
    h+=`<circle class="ghost" cx="${a[0]}" cy="${a[1]}" r=".28"/><line x1="${a[0]+dx/d*.3}" y1="${a[1]+dy/d*.3}" x2="${ex}" y2="${ey}" marker-end="url(#ah)"/>`;});
  g.innerHTML=h;
}

function renderInfo(c,pos){
  const st=S.step,mode=S.mode,title=STEPS[mode][st-1];
  const nm=p=>esc(p.name);const list=a=>a.map(nm).join(', ').replace(/, ([^,]*)$/,' and $1');
  const set=c.setter;let p='',chip='',viol=[];
  const setterRow=set?(isFront(set.zone)?'front row':'back row'):'';
  if(st===1){
    p=`Rotation ${S.rot} in rotational order. ${set?`${nm(set)} sets from the ${setterRow} (zone ${set.zone}). `:''}Each time the team wins back the serve, everyone moves one zone clockwise.`;
    if(c.liberoFor)p+=` ${esc(c.ps.find(x=>x.role==='L').name)} is in for ${esc(c.liberoFor.name)}.`;
  }else if(st===2){
    viol=overlaps(pos,c);
    chip=viol.length?`<span class="chip bad">Overlap</span>`:`<span class="chip ok">Legal at contact</span>`;
    if(mode==='serve'){
      p=`${nm(c.server)} serves from behind the end line. The other five must be in rotational order when the ball is contacted; the server is exempt.`;
      if(c.mbServes)p+=` ${nm(c.mbServes)} serves this rotation, so the libero waits until the next dead ball.`;
    }else{
      const pas=passersOf(c);
      p=`${list(pas)} ${pas.length>1?'pass':'passes'}. ${set&&S.sys!=='6-6'?`${nm(set)} starts near zone ${set.zone} and releases to the target once the serve is struck. `:''}Drag anyone to try your own formation; the overlap check updates as you move.`;
    }
  }else if(mode==='receive'&&st===3){
    const att=c.ps.filter(x=>isFront(x.zone)&&!x.sets);
    p=`${nm(set)} runs to the target between zones 2 and 3. ${att.length} front-row attacker${att.length===1?'':'s'}: ${list(att)}.${!isFront(set.zone)&&S.sys!=='6-6'?' Back-row hitters can also attack from behind the 3 m line.':''}`;
  }else if((mode==='receive'&&st===4)||(mode==='serve'&&st===3)){
    const sl=slots(c);
    p=(mode==='serve'?'Right after the serve is contacted, players switch to their specialty spots. ':'After the attack, players set up in their specialty spots. ')+
      c.ps.filter(x=>ZXY[x.zone][0]!==ZXY[{LF:4,MF:3,RF:2,LB:5,MBK:6,RB:1}[sl[x.id]]][0]||isFront(x.zone)!==['LF','MF','RF'].includes(sl[x.id]))
        .map(x=>`${nm(x)} to ${SLOTNAME[sl[x.id]]}`).join('; ');
    if(!/to /.test(p))p+='Everyone already stands in their own spot this rotation.';else p+='.';
  }else{
    p='Perimeter defense against the opponent\'s outside hitter. Right front and middle form the block, left front pulls off for tips, right back digs line and left back digs cross-court.';
  }
  const has=!!S.ov[vkey(st)];
  document.getElementById('info').innerHTML=`<h2>${title}${chip}</h2><p>${p}</p>`+
    (viol.length?`<ul class="viol">${viol.map(v=>`<li>${v.msg}</li>`).join('')}</ul>`:'')+
    `<div class="row-actions">${has?'<button class="linkbtn" id="resetView">Reset this step</button>':''}<span class="hint">${has?'You moved players on this step.':'Drag players to adjust. Gold ring = setter.'}</span></div>`;
  document.querySelectorAll('.tok').forEach(t=>t.classList.toggle('bad',viol.some(v=>v.ids.includes(t.dataset.id))));
}

/* ---------- panel ---------- */
function numIn(s,id){const v=(S.data[s].nums||{})[id]||'';return `<input type="text" class="num" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="j-${s}-${id}" data-num-for="${id}" value="${v}" placeholder="#" aria-label="Jersey number">`;}
function bench(s){const d=S.data[s];if(!Array.isArray(d.bench)||d.bench.length!==6)d.bench=Array.from({length:6},(_,i)=>(d.bench&&d.bench[i])||{name:'',num:'',pos:''});return d.bench;}
const BPOS=['','S','OH','MB','OPP','DS','L'];
function benchRows(s){const b=bench(s),slots=[...S.data[s].lineup,...(SYS[s].lib?['L']:[])];
  return b.map((p,i)=>`<div class="prow bench"><select id="bp-${s}-${i}" data-bench-pos="${i}" aria-label="Bench ${i+1} position">${BPOS.map(v=>`<option value="${v}" ${p.pos===v?'selected':''}>${v||'Pos'}</option>`).join('')}</select>
    <input type="text" class="num" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="bj-${s}-${i}" data-bench-num="${i}" value="${p.num||''}" placeholder="#" aria-label="Bench ${i+1} jersey number">
    <input type="text" id="bn-${s}-${i}" data-bench-name="${i}" value="${esc(p.name||'')}" placeholder="Bench ${i+1}" maxlength="18">
    <select id="bs-${s}-${i}" data-sub="${i}" class="subsel" aria-label="Sub bench ${i+1} in for"><option value="">Sub ⇄</option>${slots.map(id=>{const q=info(s,id);return `<option value="${id}">for ${q.num?'#'+q.num+' ':''}${esc(q.name)}</option>`;}).join('')}</select></div>`).join('');}
function numWarn(){const el=document.getElementById('numWarn');if(!el)return;const n=S.data[S.sys].nums||{},seen={},d=[];
  const ids=[...S.data[S.sys].lineup,...(SYS[S.sys].lib?['L']:[])];const vals=ids.map(id=>n[id]).concat(bench(S.sys).map(b=>b.num));vals.forEach(v=>{if(!v)return;if(seen[v]&&!d.includes(v))d.push(v);seen[v]=1;});
  el.textContent=d.length?'Jersey '+d.map(v=>'#'+v).join(', ')+(d.length>1?' are':' is')+' used more than once.':'';}
function renderPanel(){
  const s=S.sys,def=SYS[s],lu=S.data[s].lineup;
  const rows=lu.map((id,i)=>{const p=info(s,id);
    return `<div class="prow ${p.role}"><select data-zone-for="${id}" id="z-${s}-${id}" aria-label="Starting zone for ${esc(p.def)}">${[1,2,3,4,5,6].map(z=>`<option value="${z}" ${z===i+1?'selected':''}>Zone ${z}</option>`).join('')}</select>
      <div class="pchip">${p.label}</div>${numIn(s,id)}<input type="text" id="n-${s}-${id}" data-name-for="${id}" value="${esc(S.data[s].names[id]||'')}" placeholder="${esc(p.def)}" maxlength="18"></div>`;});
  const lib=def.lib?`<div class="prow L"><label class="toggle" for="libOn"><input type="checkbox" id="libOn" ${S.libero?'checked':''}>Use</label>
      <div class="pchip">L</div>${numIn(s,'L')}<input type="text" id="n-${s}-L" data-name-for="L" value="${esc(S.data[s].names.L||'')}" placeholder="Libero" maxlength="18"></div>
      <p class="blurb">The libero replaces whichever middle is in the back row.</p>`:'';
  document.getElementById('panel').innerHTML=`<h3>${s} lineup</h3><p class="blurb">${def.blurb}</p>
    <div class="label">Starting zone · jersey # · name</div><div class="plist">${rows.join('')}${lib}</div><p class="numwarn" id="numWarn"></p>
    <div class="label">Bench · position · # · name</div><div class="plist">${benchRows(s)}</div><p class="submsg" id="subMsg" aria-live="polite"></p>
    <p class="blurb">Use Sub to swap a bench player with someone on the court. The sub takes over that player's spot in the rotation.</p>
    <div class="legend"><span class="S"><i></i>Setter</span><span class="OH"><i></i>Outside</span><span class="MB"><i></i>Middle</span>${s==='5-1'?'<span class="OPP"><i></i>Opposite</span>':''}${def.lib?'<span class="L"><i></i>Libero</span>':''}</div>
    <div class="row-actions"><button class="linkbtn" id="resetAll">Reset lineup, numbers and moves</button></div>`;
  numWarn();
}

/* ---------- events ---------- */
function stopPlay(){if(playT){clearInterval(playT);playT=null;}}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.sys){stopPlay();S.sys=b.dataset.sys;save();renderPanel();render();}
  else if(b.dataset.mode){stopPlay();S.mode=b.dataset.mode;save();render();}
  else if(b.dataset.rot){stopPlay();S.rot=+b.dataset.rot;save();tick();render();}
  else if(b.dataset.step){stopPlay();S.step=+b.dataset.step;save();tick();render();}
  else if(b.id==='rotPrev'){stopPlay();S.rot=S.rot===1?6:S.rot-1;save();render();}
  else if(b.id==='rotNext'){stopPlay();S.rot=S.rot===6?1:S.rot+1;save();render();}
  else if(b.id==='fsBtn'){enterFocus();}
  else if(b.id==='fsExit'){exitFocus();}
  else if(b.dataset.act==='rotPrev'){stopPlay();S.rot=S.rot===1?6:S.rot-1;save();render();}
  else if(b.dataset.act==='rotNext'){stopPlay();S.rot=S.rot===6?1:S.rot+1;save();render();}
  else if(b.id==='play'||b.dataset.act==='play'){if(playT){stopPlay();render();return;}S.step=1;render();
    playT=setInterval(()=>{if(S.step>=4){stopPlay();render();return;}S.step++;render();},1500);render();}
  else if(b.id==='resetView'){delete S.ov[vkey(S.step)];save();render();}
  else if(b.id==='resetAll'){
    if(b.dataset.armed){const s=S.sys;S.data[s]={lineup:SYS[s].players.map(p=>p[0]),names:{}};
      for(const k in S.ov)if(k.startsWith(s+'|'))delete S.ov[k];save();renderPanel();render();}
    else{b.dataset.armed='1';b.textContent='Tap again to reset '+S.sys;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reset lineup, numbers and moves';}},3000);}
  }
});
document.addEventListener('input',e=>{
  const ds=e.target.dataset||{};
  if(ds.benchName!==undefined){bench(S.sys)[+ds.benchName].name=e.target.value.trim();save();return;}
  if(ds.benchNum!==undefined){const el=e.target,raw=el.value.replace(/\D/g,'').slice(0,2);if(raw!==el.value)el.value=raw;
    const n=parseInt(raw,10),ok=raw===''||(n>=1&&n<=99);el.setAttribute('aria-invalid',!ok);if(!ok)return;
    bench(S.sys)[+ds.benchNum].num=raw===''?'':String(n);save();numWarn();return;}
  const nf=e.target.dataset&&e.target.dataset.numFor;
  if(nf){const el=e.target,raw=el.value.replace(/\D/g,'').slice(0,2);if(raw!==el.value)el.value=raw;
    const n=parseInt(raw,10),ok=raw===''||(n>=1&&n<=99);el.setAttribute('aria-invalid',!ok);
    if(!ok)return;S.data[S.sys].nums=S.data[S.sys].nums||{};if(raw==='')delete S.data[S.sys].nums[nf];else S.data[S.sys].nums[nf]=String(n);
    save();numWarn();clearTimeout(window.__nt);window.__nt=setTimeout(render,250);return;}
  const id=e.target.dataset&&e.target.dataset.nameFor;if(!id)return;
  S.data[S.sys].names[id]=e.target.value.trim();save();clearTimeout(window.__nt);window.__nt=setTimeout(render,250);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='libOn'){S.libero=t.checked;save();render();return;}
  if(t.dataset&&t.dataset.benchPos!==undefined){bench(S.sys)[+t.dataset.benchPos].pos=t.value;save();return;}
  if(t.dataset&&t.dataset.sub!==undefined){const i=+t.dataset.sub,id=t.value;if(!id)return;
    const d=S.data[S.sys],b=bench(S.sys)[i];d.nums=d.nums||{};
    if(!b.name&&!b.num){t.value='';const m=document.getElementById('subMsg');if(m){m.style.color='var(--bad)';m.textContent='Add a name or number for that bench spot first.';}return;}
    const out=info(S.sys,id),inName=b.name,inNum=b.num;
    b.name=d.names[id]||'';b.num=d.nums[id]||'';b.pos={S:'S',OH:'OH',MB:'MB',OPP:'OPP',L:'L'}[out.role]||b.pos;
    if(inName)d.names[id]=inName;else delete d.names[id];if(inNum)d.nums[id]=inNum;else delete d.nums[id];
    save();renderPanel();render();
    const m=document.getElementById('subMsg');if(m){m.style.color='';m.textContent=`${inNum?'#'+inNum+' ':''}${inName||'Bench player'} in for ${out.num?'#'+out.num+' ':''}${out.name}.`;}return;}
  const id=t.dataset&&t.dataset.zoneFor;if(!id)return;
  const lu=S.data[S.sys].lineup,from=lu.indexOf(id),to=+t.value-1;
  [lu[from],lu[to]]=[lu[to],lu[from]];save();renderPanel();render();
});
let wake=null;
function enterFocus(){document.body.classList.add('focus');scrollTo(0,0);
  try{const el=document.documentElement,rf=el.requestFullscreen||el.webkitRequestFullscreen;if(rf){const r=rf.call(el);if(r&&r.catch)r.catch(()=>{});}}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});}catch(e){}
  render();}
function exitFocus(){document.body.classList.remove('focus');
  try{const fe=document.fullscreenElement||document.webkitFullscreenElement,ex=document.exitFullscreen||document.webkitExitFullscreen;if(fe&&ex){const r=ex.call(document);if(r&&r.catch)r.catch(()=>{});}}catch(e){}
  try{if(wake){wake.release();wake=null;}}catch(e){}
  render();document.getElementById('fsBtn').focus({preventScroll:false});}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('focus')){exitFocus();return;}
  if(e.target.matches('input,select'))return;
  if(e.key==='ArrowRight'){S.step=Math.min(4,S.step+1);render();}
  else if(e.key==='ArrowLeft'){S.step=Math.max(1,S.step-1);render();}
});

function bindDrag(t){
  t.addEventListener('pointerdown',e=>{stopPlay();e.preventDefault();try{t.setPointerCapture(e.pointerId);}catch(_){}
    drag={id:t.dataset.id,t};t.classList.add('drag');});
  t.addEventListener('pointermove',e=>{if(!drag||drag.t!==t)return;const r=court.getBoundingClientRect();
    const x=Math.min(9,Math.max(0,(e.clientX-r.left)/r.width*9)),y=Math.min(9.75,Math.max(-.3,(e.clientY-r.top)/r.height*9.45-.45));
    cur[drag.id]=[x,y];if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!drag)return;place(drag.t,cur[drag.id]);drawArrows(curC,cur);if(S.step===2)renderInfo(curC,cur);});});
  const end=()=>{if(!drag||drag.t!==t)return;if(raf){cancelAnimationFrame(raf);raf=0;}t.classList.remove('drag');const k=vkey(S.step);
    S.ov[k]=Object.assign({},S.ov[k],{[drag.id]:cur[drag.id].map(v=>Math.round(v*100)/100)});drag=null;save();tick();render();};
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
}


/* ---------- team look ---------- */
function hexRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function rgbHex(r){return '#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function lum(h){const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function inkFor(h){return lum(h)>.42?'#10201f':'#ffffff';}
function shade(h,f){const r=hexRgb(h);return rgbHex(f<0?r.map(v=>v*(1+f)):r.map(v=>v+(255-v)*f));}
function team(){S.team=Object.assign({},DEF_TEAM,S.team||{});if(S.team.court===true)S.team.surface='team';delete S.team.court;return S.team;}
function buildWood(){
  const defs=document.getElementById('woodDefs');if(!defs||document.getElementById('woodCourt'))return;
  const NS='http://www.w3.org/2000/svg';let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  function pat(id,h,sat,l0,spread){
    const p=document.createElementNS(NS,'pattern');p.setAttribute('id',id);p.setAttribute('patternUnits','userSpaceOnUse');
    p.setAttribute('x','0');p.setAttribute('y','-0.45');p.setAttribute('width','9');p.setAttribute('height','10.35');
    const W=0.26;let out='';
    for(let x=0;x<9;x+=W){let y=-rnd()*2.4;
      while(y<10.4){const len=1.3+rnd()*2.2,l=l0+(rnd()-.5)*spread,hh=h+(rnd()-.5)*5;
        out+=`<rect x="${x.toFixed(3)}" y="${y.toFixed(3)}" width="${W}" height="${len.toFixed(3)}" fill="hsl(${hh.toFixed(1)},${sat}%,${l.toFixed(1)}%)" stroke="rgba(80,45,15,.35)" stroke-width=".012"/>`;
        const gx=x+W*(.25+rnd()*.5);out+=`<line x1="${gx.toFixed(3)}" y1="${(y+.05).toFixed(3)}" x2="${(gx+(rnd()-.5)*.05).toFixed(3)}" y2="${(y+len-.05).toFixed(3)}" stroke="rgba(120,70,25,${(.08+rnd()*.1).toFixed(2)})" stroke-width=".01"/>`;
        y+=len;}}
    p.innerHTML=out;defs.appendChild(p);}
  pat('woodCourt',34,58,74,9);
}
function applyTeam(){
  const t=team(),st=document.documentElement.style,custom=t.primary!==DEF_TEAM.primary||t.accent!==DEF_TEAM.accent;
  const vars=['--brand','--brand-ink','--accent','--accent-ink','--lib','--court','--free','--net','--wood-line'];vars.forEach(v=>st.removeProperty(v));
  if(custom||t.surface==='team'){
    st.setProperty('--brand',t.primary);st.setProperty('--brand-ink',inkFor(t.primary));
    st.setProperty('--accent',t.accent);st.setProperty('--accent-ink',inkFor(t.accent));st.setProperty('--lib',t.accent);
  }
  if(t.surface==='team'){const c=lum(t.primary)>.35?shade(t.primary,-.45):t.primary;st.setProperty('--court',c);st.setProperty('--free',t.accent);st.setProperty('--net',shade(c,-.7));}
  if(t.surface==='wood')buildWood();
  court.classList.toggle('wood',t.surface==='wood');
  if(custom&&lum(t.primary)<.5)st.setProperty('--wood-line',t.primary);else st.removeProperty('--wood-line');
  document.querySelectorAll('[data-surface]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.surface===t.surface));
  document.getElementById('hdrName').textContent=t.name||'Rotation Ready';
  document.getElementById('hdrTag').textContent=t.name?'Rotation Ready':'Volleyball rotations & lineups';
  const lb=document.getElementById('hdrLogo');lb.classList.toggle('custom',!!t.logo);document.getElementById('hdrImg').src=t.logo||DEF_LOGO;
  document.getElementById('sw1').style.background=t.primary;document.getElementById('sw2').style.background=t.accent;
  const pv=document.getElementById('tLogoPrev');pv.innerHTML=t.logo?`<img src="${t.logo}" alt="Team logo">`:'No logo';
  document.getElementById('tLogoClear').hidden=!t.logo;
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=t.primary;
}
function fillTeamForm(){const t=team();document.getElementById('tName').value=t.name;document.getElementById('tPrimary').value=t.primary;document.getElementById('tAccent').value=t.accent;}
function teamMsg(m){document.getElementById('teamMsg').textContent=m||'';}
document.getElementById('tName').addEventListener('input',e=>{team().name=e.target.value.trim();save();applyTeam();});
document.getElementById('tPrimary').addEventListener('input',e=>{team().primary=e.target.value;applyTeam();});
document.getElementById('tAccent').addEventListener('input',e=>{team().accent=e.target.value;applyTeam();});
['tPrimary','tAccent'].forEach(id=>document.getElementById(id).addEventListener('change',()=>save()));
document.getElementById('tSurface').addEventListener('click',e=>{const b=e.target.closest('[data-surface]');if(!b)return;team().surface=b.dataset.surface;save();tick();applyTeam();});
document.getElementById('tLogo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';teamMsg('');if(!f)return;
  if(!/^image\//.test(f.type)){teamMsg('That file is not an image. Choose a PNG or JPG.');return;}
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const max=256,k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    let d=c.toDataURL('image/png');if(d.length>300000)d=c.toDataURL('image/jpeg',.85);
    team().logo=d;save();applyTeam();tick();};
  img.onerror=()=>{URL.revokeObjectURL(url);teamMsg('That image could not be opened. Try a PNG or JPG.');};
  img.src=url;});
document.getElementById('tLogoClear').addEventListener('click',()=>{team().logo='';save();applyTeam();});
document.getElementById('hdrLogo').addEventListener('click',()=>{const d=document.getElementById('teamCard');d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});});
document.getElementById('tReset').addEventListener('click',e=>{const b=e.currentTarget;
  if(b.dataset.armed){S.team=Object.assign({},DEF_TEAM);save();fillTeamForm();applyTeam();delete b.dataset.armed;b.textContent='Restore default look';}
  else{b.dataset.armed='1';b.textContent='Tap again to restore';setTimeout(()=>{delete b.dataset.armed;b.textContent='Restore default look';},3000);}});

buildStatic();renderPanel();fillTeamForm();applyTeam();applyZoom();render();
})();
</script>
